{% extends "base.html" %}
{% block content %}

<style>
    main {
        position: relative;
        z-index: 1;
        max-width: 480px;
        margin: 0 auto;
        padding: 5rem 1.5rem 7rem;
        animation: fadeUp .5s ease both;
    }

    .auth-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.5rem 2rem;
        position: relative;
        overflow: hidden;
        box-shadow: 0 32px 80px rgba(0, 0, 0, .3);
    }

    .auth-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--accent), #00b38f);
    }

    .auth-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: var(--accent-dim);
        border: 1px solid rgba(0, 212, 170, .2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        margin-bottom: 1.5rem;
    }

    .auth-title {
        font-family: 'Outfit', sans-serif;
        font-size: 1.5rem;
        font-weight: 900;
        letter-spacing: -.75px;
        margin-bottom: .35rem;
    }

    .auth-subtitle {
        color: var(--muted);
        font-size: .875rem;
        line-height: 1.6;
        margin-bottom: 2rem;
    }

    .field {
        margin-bottom: 1.1rem;
    }

    .field label {
        display: block;
        font-size: .72rem;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: .35rem;
        letter-spacing: .07em;
        text-transform: uppercase;
    }

    .field input {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: 8px;
        padding: .7rem .9rem;
        color: var(--text);
        font-family: 'Outfit', sans-serif;
        font-size: .9rem;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
    }

    .field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .field input::placeholder {
        color: var(--muted);
    }

    /* Django renders {{ form.as_p }} — style its paragraph wrapper */
    .form-wrap p {
        margin-bottom: 1.1rem;
    }

    .form-wrap p label {
        display: block;
        font-size: .72rem;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: .35rem;
        letter-spacing: .07em;
        text-transform: uppercase;
    }

    .form-wrap p input[type="email"] {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: 8px;
        padding: .7rem .9rem;
        color: var(--text);
        font-family: 'Outfit', sans-serif;
        font-size: .9rem;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
    }

    .form-wrap p input[type="email"]:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .form-wrap p input[type="email"]::placeholder {
        color: var(--muted);
    }

    .btn-submit {
        width: 100%;
        background: var(--accent);
        border: none;
        color: #080c10;
        padding: .75rem 1rem;
        border-radius: 10px;
        font-family: 'Outfit', sans-serif;
        font-size: .95rem;
        font-weight: 800;
        cursor: pointer;
        margin-top: .5rem;
        transition: opacity .2s, transform .15s, box-shadow .2s;
        box-shadow: 0 0 24px rgba(0, 212, 170, .35);
    }

    .btn-submit:hover {
        opacity: .88;
        transform: translateY(-1px);
        box-shadow: 0 0 36px rgba(0, 212, 170, .5);
    }

    .btn-submit:active {
        transform: translateY(0);
    }

    .auth-back {
        display: flex;
        justify-content: center;
        margin-top: 1.5rem;
        font-size: .82rem;
        color: var(--muted);
    }

    .auth-back a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        margin-left: .3rem;
    }

    .auth-back a:hover {
        text-decoration: underline;
    }
</style>

<main>
    <div class="auth-card">

        <div class="auth-icon">🔑</div>

        <div class="auth-title">Forgot password?</div>
        <p class="auth-subtitle">
            Enter the email address linked to your account and we'll send you a reset link.
        </p>

        <form method="POST" class="form-wrap">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Send Reset Link &#8594;</button>
        </form>

        <div class="auth-back">
            Remember it? <a href="{% url 'home' %}">Back to login</a>
        </div>

    </div>
</main>

{% endblock %}
