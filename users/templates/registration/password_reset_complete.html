{% extends "base.html" %}
{% block content %}

<style>
    main {
        position: relative;
        z-index: 1;
        max-width: 480px;
        margin: 0 auto;
        padding: 5rem 1.5rem 7rem;
        animation: fadeUp .5s ease both;
    }

    /* CARD */
    .auth-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3rem 2.5rem 2.5rem;
        position: relative;
        overflow: hidden;
        box-shadow: 0 32px 80px rgba(0, 0, 0, .35), 0 0 0 1px rgba(16, 185, 129, .06);
        text-align: center;
    }

    .auth-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--success), #059669);
    }

    /* soft glow blob behind the icon */
    .auth-card::after {
        content: '';
        position: absolute;
        top: -60px;
        left: 50%;
        transform: translateX(-50%);
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(16, 185, 129, .12) 0%, transparent 70%);
        pointer-events: none;
    }

    /* SUCCESS ICON */
    .success-ring {
        position: relative;
        width: 84px;
        height: 84px;
        margin: 0 auto 2rem;
        z-index: 1;
    }

    .success-ring svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        animation: spin-in .6s ease both;
    }

    .success-ring-inner {
        position: absolute;
        inset: 10px;
        background: rgba(16, 185, 129, .12);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        animation: scaleIn .4s .25s ease both;
        opacity: 0;
        animation-fill-mode: both;
    }

    /* TITLE */
    .auth-title {
        font-family: 'Outfit', sans-serif;
        font-size: 1.75rem;
        font-weight: 900;
        letter-spacing: -1px;
        margin-bottom: .5rem;
        color: var(--text);
    }

    .auth-subtitle {
        color: var(--muted);
        font-size: .9rem;
        line-height: 1.7;
        max-width: 310px;
        margin: 0 auto 2rem;
    }

    /* STEPS */
    .steps-done {
        display: flex;
        flex-direction: column;
        gap: .55rem;
        margin-bottom: 2rem;
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.1rem 1.25rem;
    }

    .step-item {
        display: flex;
        align-items: center;
        gap: .75rem;
        font-size: .845rem;
        color: var(--text2);
    }

    .step-check {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        flex-shrink: 0;
        background: rgba(16, 185, 129, .12);
        border: 1px solid rgba(16, 185, 129, .25);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: .62rem;
        color: var(--success);
        font-weight: 700;
    }

    .step-label {
        flex: 1;
    }

    .step-done-tag {
        font-size: .65rem;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--success);
        background: rgba(16, 185, 129, .1);
        border: 1px solid rgba(16, 185, 129, .2);
        padding: .12rem .5rem;
        border-radius: 999px;
        font-family: 'JetBrains Mono', monospace;
    }

    /* DIVIDER */
    .or-divider {
        display: flex;
        align-items: center;
        gap: .75rem;
        margin: 1.5rem 0;
        color: var(--muted);
        font-size: .76rem;
    }

    .or-divider::before,
    .or-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    /* MAIN BUTTON */
    .btn-login {
        display: inline-flex;
        align-items: center;
        gap: .5rem;
        background: var(--accent);
        border: none;
        color: #080c10;
        padding: .85rem 2.5rem;
        border-radius: 10px;
        width: 100%;
        justify-content: center;
        font-family: 'Outfit', sans-serif;
        font-size: .95rem;
        font-weight: 800;
        cursor: pointer;
        text-decoration: none;
        transition: opacity .2s, transform .15s, box-shadow .2s;
        box-shadow: 0 0 28px rgba(0, 212, 170, .4);
    }

    .btn-login:hover {
        opacity: .88;
        transform: translateY(-2px);
        box-shadow: 0 0 42px rgba(0, 212, 170, .55);
    }

    /* FOOTER HINT */
    .card-footer-hint {
        margin-top: 1.25rem;
        font-size: .78rem;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .35rem;
    }

    .card-footer-hint a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
    }

    .card-footer-hint a:hover {
        text-decoration: underline;
    }

    /* CUSTOM ANIMATIONS */
    @keyframes spin-in {
        from {
            opacity: 0;
            transform: rotate(-90deg) scale(.8);
        }

        to {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }
    }
</style>

<main>
    <div class="auth-card">

        <!-- ANIMATED SUCCESS RING -->
        <div class="success-ring">
            <svg viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="42" cy="42" r="40" stroke="rgba(16,185,129,.25)" stroke-width="1.5" />
                <circle cx="42" cy="42" r="40" stroke="var(--success)" stroke-width="2" stroke-linecap="round"
                    stroke-dasharray="251" stroke-dashoffset="251"
                    style="animation: draw-circle .7s .1s ease forwards;">
                </circle>
            </svg>
            <div class="success-ring-inner">&#10003;</div>
        </div>

        <div class="auth-title">Password changed!</div>
        <p class="auth-subtitle">
            Your password has been updated successfully. You can now sign in with your new credentials.
        </p>

        <!-- STEPS SUMMARY -->
        <div class="steps-done">
            <div class="step-item">
                <div class="step-check">&#10003;</div>
                <span class="step-label">Reset link requested</span>
                <span class="step-done-tag">done</span>
            </div>
            <div class="step-item">
                <div class="step-check">&#10003;</div>
                <span class="step-label">Link verified</span>
                <span class="step-done-tag">done</span>
            </div>
            <div class="step-item">
                <div class="step-check">&#10003;</div>
                <span class="step-label">New password set</span>
                <span class="step-done-tag">done</span>
            </div>
        </div>

        <a href="{% url 'home' %}" class="btn-login">
            Log in now &#8594;
        </a>

        <div class="card-footer-hint">
            Trouble signing in?
            <a href="#">Contact support</a>
        </div>

    </div>
</main>

<style>
    @keyframes draw-circle {
        to {
            stroke-dashoffset: 0;
        }
    }
</style>

{% endblock %}
