{% extends "base.html" %}
{% block content %}

<style>
    main {
        position: relative;
        z-index: 1;
        max-width: 480px;
        margin: 0 auto;
        padding: 5rem 1.5rem 7rem;
        animation: fadeUp .5s ease both;
    }

    .auth-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.5rem 2rem;
        position: relative;
        overflow: hidden;
        box-shadow: 0 32px 80px rgba(0, 0, 0, .3);
        text-align: center;
    }

    .auth-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--success), #059669);
    }

    .success-icon {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(16, 185, 129, .1);
        border: 1px solid rgba(16, 185, 129, .25);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        margin: 0 auto 1.5rem;
        animation: scaleIn .4s ease both;
    }

    .auth-title {
        font-family: 'Outfit', sans-serif;
        font-size: 1.6rem;
        font-weight: 900;
        letter-spacing: -.75px;
        margin-bottom: .75rem;
    }

    .auth-subtitle {
        color: var(--muted);
        font-size: .9rem;
        line-height: 1.7;
        margin-bottom: 2.25rem;
        max-width: 320px;
        margin-left: auto;
        margin-right: auto;
    }

    .steps-done {
        display: flex;
        flex-direction: column;
        gap: .6rem;
        margin-bottom: 2rem;
        text-align: left;
    }

    .step-item {
        display: flex;
        align-items: center;
        gap: .75rem;
        font-size: .85rem;
        color: var(--text2);
    }

    .step-check {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(16, 185, 129, .12);
        border: 1px solid rgba(16, 185, 129, .25);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: .65rem;
        color: var(--success);
        font-weight: 700;
        flex-shrink: 0;
    }

    .btn-login {
        display: inline-flex;
        align-items: center;
        gap: .5rem;
        background: var(--accent);
        border: none;
        color: #080c10;
        padding: .8rem 2.25rem;
        border-radius: 10px;
        font-family: 'Outfit', sans-serif;
        font-size: .95rem;
        font-weight: 800;
        cursor: pointer;
        text-decoration: none;
        transition: opacity .2s, transform .15s, box-shadow .2s;
        box-shadow: 0 0 28px rgba(0, 212, 170, .4);
    }

    .btn-login:hover {
        opacity: .88;
        transform: translateY(-2px);
        box-shadow: 0 0 42px rgba(0, 212, 170, .55);
    }
</style>

<main>
    <div class="auth-card">

        <div class="success-icon">&#10003;</div>

        <div class="auth-title">Password changed!</div>
        <p class="auth-subtitle">
            Your password has been updated successfully. You can now log in with your new password.
        </p>

        <div class="steps-done">
            <div class="step-item">
                <div class="step-check">&#10003;</div>
                Reset link requested
            </div>
            <div class="step-item">
                <div class="step-check">&#10003;</div>
                Link verified
            </div>
            <div class="step-item">
                <div class="step-check">&#10003;</div>
                New password set
            </div>
        </div>

        <a href="{% url 'home' %}" class="btn-login">Log in now &#8594;</a>

    </div>
</main>

{% endblock %}
