version: "3.9"

services:
  db:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_DB: resume_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: django-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db